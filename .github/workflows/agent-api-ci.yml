name: Agent API CI

on:
  push:
    branches: [main, feature/autonomous-website-agent-api, feature/product-console-v2]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r api/requirements.txt
      - name: Compile API runtime
        run: >-
          python -m py_compile
          api/main.py api/robust_generation.py api/premium_generation.py api/design_engine_v2.py api/premium_quality.py api/quality_originality_v2.py
          api/billing.py api/billing_gate.py api/media.py api/media_render.py api/binary_publish.py
          api/pages_publish.py api/visual_qa.py api/vision_review.py api/enhanced_runtime.py
          api/learning_runtime.py api/revisions.py api/retry_routes.py api/dashboard.py
          api/preview.py api/notifications.py api/handoff_runtime.py
          api/model_router.py api/repo_map.py api/deep_static_qa.py api/design_critic.py
          api/source_editor.py api/site_import.py api/brief_import.py api/image_studio.py api/autonomous_supervisor.py api/production_queue.py api/production_lifecycle.py api/capabilities.py
          api/server.py api/preflight.py api/create_test_user.py tools/production_load_test.py
      - name: Import complete server
        env:
          APP_SECRET: ci-only-secret
          OLLAMA_MODEL: qwen2.5-coder:3b
          VISUAL_QA_MODEL: qwen2.5vl:3b
          VISUAL_QA_VISION: 'false'
        run: |
          python - <<'PY'
          import api.server
          routes = {route.path for route in api.server.app.routes}
          required = {
              '/health',
              '/auth/register',
              '/auth/login',
              '/projects',
              '/projects/{project_id}/images',
              '/projects/{project_id}/revise',
              '/projects/{project_id}/revisions',
              '/projects/{project_id}/source.zip',
              '/projects/{project_id}/visual-qa',
              '/projects/{project_id}/preview-session',
              '/projects/{project_id}/handoff',
              '/projects/{project_id}/handoff-email',
              '/projects/{project_id}/domain',
              '/dashboard/projects',
              '/billing/config',
              '/billing/checkout',
              '/agent/learning',
              '/agent/state',
              '/agent/models',
              '/agent/capabilities',
              '/agent/design-engine',
              '/agent/production-queue',
              '/agent/preflight',
              '/projects/{project_id}/cancel',
              '/projects/{project_id}/archive',
              '/projects/{project_id}/restore',
              '/agent/originality',
              '/agent/supervisor',
              '/agent/supervisor/run',
              '/projects/{project_id}/supervisor',
              '/imports/site',
              '/imports/brief',
              '/projects/{project_id}/editor/files',
              '/projects/{project_id}/editor/file',
              '/projects/{project_id}/editor/context',
              '/projects/{project_id}/versions',
              '/projects/{project_id}/rollback',
              '/projects/{project_id}/images/{image_id}/preview',
              '/projects/{project_id}/image-studio/history/{image_id}',
              '/projects/{project_id}/image-studio/edit',
              '/projects/{project_id}/image-studio/generate-background',
              '/projects/{project_id}/image-studio/restore/{snapshot_id}',
          }
          missing = required - routes
          assert not missing, f'Missing routes: {missing}'
          print(api.server.app.title)
          PY
      - name: Validate media placement rules
        run: |
          python - <<'PY'
          from api.media import _safe_placement, _clamp_percent
          assert _safe_placement('hero') == 'hero'
          assert _safe_placement('logo') == 'logo'
          assert _safe_placement('page:programme:content') == 'page:programme:content'
          assert _safe_placement('page:stories:gallery') == 'page:stories:gallery'
          assert _safe_placement('../unsafe') == 'auto'
          assert _clamp_percent(-4) == 0
          assert _clamp_percent(104) == 100
          PY
      - name: Validate ZIP import and repo map safety
        run: |
          python - <<'PY'
          from fastapi import HTTPException
          from PIL import Image
          from api.site_import import _normalise_member, _write_stage, _read_stage, _stage_text_files, _stage_dir, _bundle_sha256
          from api.brief_import import _labelled_fields, _normalise
          from api.binary_publish import _expected_bundle_manifest, _tree_matches_bundle
          from api.repo_map import build_repo_map
          from api.media import _focal_crop

          assert _normalise_member('site/assets/app.js') == 'site/assets/app.js'

          staging_id = 'ci-zip-stage'
          staged_files = {
              'index.html': b'<!doctype html><html><head><title>Stage</title></head><body><main>OK</main></body></html>',
              'assets/site.css': b'body{margin:0}',
          }
          _write_stage(staging_id, staged_files, {'repo_slug':'ci-repo','safe_name':'CI','config':{}})
          restored, manifest = _read_stage(staging_id)
          assert restored == staged_files
          assert manifest['repo_slug'] == 'ci-repo'
          staged_text, deliverable = _stage_text_files(restored)
          assert 'index.html' in staged_text and isinstance(deliverable['index.html'], str)
          assert _bundle_sha256(staged_files) == _bundle_sha256(dict(reversed(list(staged_files.items()))))

          exact_bundle = {
              'index.html': staged_files['index.html'].decode('utf-8'),
              'assets/site.css': staged_files['assets/site.css'].decode('utf-8'),
              'assets/photo.png': b'\\x89PNG\\r\\n\\x1a\\nCI',
          }
          manifest = _expected_bundle_manifest(exact_bundle)
          tree = [{'path': path, 'type': 'blob', 'sha': sha} for path, sha in manifest.items()]
          exact, expected, actual = _tree_matches_bundle(exact_bundle, tree)
          assert exact and expected == actual
          tree_with_stale = tree + [{'path':'README.md','type':'blob','sha':'deadbeef'}]
          exact, _, actual = _tree_matches_bundle(exact_bundle, tree_with_stale)
          assert not exact and 'README.md' in actual

          import shutil
          shutil.rmtree(_stage_dir(staging_id), ignore_errors=True)
          assert _normalise_member('node_modules/x.js') is None
          labelled = _labelled_fields('Ime projekta: Raven Lab\nOrganizacija: Povod\nStrani:\n- Domov | predstavitev\n- Kontakt | povpraševanje\nPrimarna barva: #123456')
          brief = _normalise(labelled, 'test brief')
          assert brief['name'] == 'Raven Lab'
          assert brief['organization'] == 'Povod'
          assert brief['brand']['primary_color'] == '#123456'
          assert [p['title'] for p in brief['pages']] == ['Domov', 'Kontakt']
          assert brief['package'] == 'Start'
          try:
              _normalise_member('../escape.html')
              raise AssertionError('Traversal path was accepted')
          except HTTPException:
              pass

          files = {
              'index.html': '<!doctype html><html><head><title>Demo</title></head><body><h1>Hello</h1><main id="main">X</main></body></html>',
              'assets/site.css': ':root{--primary:#123456}.hero{display:grid}@media(max-width:700px){.hero{display:block}}',
              'assets/site.js': 'function boot(){ return true; }',
          }
          repo_map = build_repo_map(files)
          assert 'index.html' in repo_map and 'Hello' in repo_map and 'boot' in repo_map

          image = Image.new('RGB', (1600, 1200), 'white')
          cropped = _focal_crop(image, 16/10, 75, 40)
          assert cropped.size == (1600, 1000)
          image.close()
          cropped.close()
          print('ZIP, repo map and focal crop smoke tests passed')
          PY
      - name: Validate production V2 architecture
        run: |
          python - <<'PY'
          import uuid
          from api import design_engine_v2 as design
          from api import production_queue as queue
          from api import quality_originality_v2 as originality

          assert len(design.MOTIFS) >= 12
          html = '<!doctype html><html><body class="page page-index"><main><section class="hero"></section><section class="section intro"></section></main></body></html>'
          stamped = design._stamp_html(html, 'swiss_editorial', 'rail')
          assert 'data-design-system="design-v2"' in stamped
          assert 'motif-swiss_editorial' in stamped and 'composition-rail' in stamped
          assert design._motif_css('creative_brutal', 'offset') != design._motif_css('luxury_minimal', 'offset')

          project_id = 'ci-queue-' + uuid.uuid4().hex
          assert queue.enqueue_project(project_id)
          assert not queue.enqueue_project(project_id)
          claimed = queue._claim_next('ci-worker')
          assert claimed == project_id
          queue._finish(project_id, 'done')

          files_a = {
              'index.html': stamped,
              'assets/site.css': design._motif_css('swiss_editorial', 'rail'),
          }
          files_b = {
              'index.html': design._stamp_html(html, 'automotive_dark', 'stacked'),
              'assets/site.css': design._motif_css('automotive_dark', 'stacked'),
          }
          fp_a = originality._fingerprint(files_a)
          fp_same = originality._fingerprint(dict(files_a))
          fp_b = originality._fingerprint(files_b)
          assert originality._similarity(fp_a, fp_same) == 1.0
          assert originality._similarity(fp_a, fp_b) < originality.HIGH_SIMILARITY

          clean = originality._anti_slop_issues(files_a, {'name':'CI','organization':'CI'})
          assert not any(x['code'] == 'DESIGN_ENGINE_V2_MISSING' for x in clean)
          slop = {'index.html': stamped.replace('</main>', '<p>Unlock your potential with cutting-edge solutions and a seamless experience.</p></main>'), 'assets/site.css': files_a['assets/site.css']}
          findings = originality._anti_slop_issues(slop, {'name':'CI','organization':'CI'})
          assert any(x['code'] == 'AI_SLOP_DENSITY' for x in findings)
          print('Design V2, durable queue and originality gate tests passed')
          PY
      - name: Validate smoke-test regressions
        run: |
          python - <<'PY'
          from api import premium_generation as premium
          from api import robust_generation as robust

          config = {
              'name':'CI Service','organization':'CI Service','package':'Standard',
              'programme':'Local service','language':'en',
              'goal':'Explain the service clearly and generate enquiries.',
              'audience':'Local customers','tone':'clear and human',
              'hero_title':'A clear service, done well.','hero_subtitle':'Useful information without friction.',
              'cta_text':'Contact us','contact_email':None,
              'brand':{'primary_color':'#17324d','secondary_color':'#7eb6a1','background_color':'#f2f4f1','text_color':'#17212b'},
          }
          spec = {
              'site_name':'CI Service',
              'pages':[
                  {'slug':'index','title':'Home','purpose':'Overview','sections':[]},
                  {'slug':'services','title':'Services','purpose':'Services','sections':[]},
                  {'slug':'kontakt','title':'Kontakt','purpose':'Contact','sections':[]},
              ],
          }
          page = premium._render_page(config, spec, spec['pages'][0], 0)
          low = page.lower()
          assert page.count('<section') >= 5
          assert 'aria-label="Open navigation menu"' in page
          assert 'aria-label="Footer navigation"' in page
          assert 'href="kontakt.html"' in page
          assert '<!doctype html>' in low and 'name="viewport"' in low and 'name="description"' in low
          assert robust._model_issue_is_supported({'code':'missing-doctype','file':'index.html'}, {'index.html':page}) is False
          assert robust._model_issue_is_supported({'code':'missing-semantic-structure','file':'index.html'}, {'index.html':page}) is False
          assert robust._model_issue_is_supported({'code':'missing-aria-label','file':'index.html'}, {'index.html':page}) is False
          assert robust._model_issue_is_supported({'code':'404','file':'index.html'}, {'index.html':page}) is False
          notes = robust._normalize_model_issues([
              {'severity':'high','code':'404','file':'index.html','message':'invented blocker'},
              {'severity':'high','code':'missing-title','file':'index.html','message':'title absent'},
          ], {'index.html':page})
          assert all(x['severity'] == 'medium' for x in notes)
          css = premium._css(config)
          assert '@media(max-width:980px){.menu{display:block}' in css
          print('Smoke-test regression guards passed')
          PY
      - name: Validate calibrated visual QA scoring
        run: |
          python - <<'PY'
          from api.visual_qa import _calibrated_issue_score

          repeated_medium = [
              {'severity':'medium','code':'VISUAL_LOW_CONTRAST','file':f'page-{p}.html','viewport':v}
              for p in range(6)
              for v in ('desktop','tablet','mobile')
          ]
          score = _calibrated_issue_score(repeated_medium)
          assert score >= 80, score

          distinct_high = [
              {'severity':'high','code':'VISUAL_HORIZONTAL_OVERFLOW','file':'index.html','viewport':'mobile'},
              {'severity':'high','code':'VISUAL_NAV_MISSING','file':'index.html','viewport':'desktop'},
              {'severity':'high','code':'VISUAL_BROKEN_IMAGE','file':'services.html','viewport':'desktop'},
          ]
          assert _calibrated_issue_score(distinct_high) < 60

          one_global_high = [
              {'severity':'high','code':'VISUAL_HORIZONTAL_OVERFLOW','file':f'page-{p}.html','viewport':v}
              for p in range(6)
              for v in ('desktop','tablet','mobile')
          ]
          assert 55 <= _calibrated_issue_score(one_global_high) <= 80
          print('Calibrated visual QA scoring checks passed')
          PY
      - name: Validate fast-quality production profile
        run: |
          python - <<'PY'
          import asyncio, os
          from api import design_critic
          from api import robust_generation
          from api import vision_review

          good = {
              'pages': [
                  {'sections': [
                      {'heading':'One','body':'A'*100},
                      {'heading':'Two','body':'B'*100},
                      {'heading':'Three','body':'C'*100},
                  ]}
              ]
          }
          weak = {'pages':[{'sections':[{'heading':'One','body':'short'}]}]}
          assert design_critic._plan_needs_critic(good) is False
          assert design_critic._plan_needs_critic(weak) is True
          assert vision_review.MAX_VISION_PAGES == 1

          async def check():
              old = os.environ.get('MODEL_QA_MODE')
              os.environ['MODEL_QA_MODE'] = 'deterministic'
              try:
                  result = await robust_generation.ai_audit({'index.html':'<!doctype html><html><body></body></html>'}, {})
                  assert result.get('model_qa_skipped') is True
                  assert result['issues'][0]['code'] == 'MODEL_QA_ADAPTIVE_SKIP'
              finally:
                  if old is None:
                      os.environ.pop('MODEL_QA_MODE', None)
                  else:
                      os.environ['MODEL_QA_MODE'] = old
          asyncio.run(check())
          print('Fast-quality profile checks passed')
          PY
      - name: Validate deterministic art-direction diversity
        run: |
          python - <<'PY'
          from api import premium_generation as premium

          motifs = [
              'swiss_editorial','luxury_minimal','outdoor_field','corporate_grid',
              'creative_brutal','tech_precision','organic_story','automotive_dark',
              'hospitality_warm','ngo_story','local_service','magazine',
          ]
          variants=set()
          samples=[]
          for motif in motifs:
              spec={'design_system':{'motif':motif,'composition':'offset'}}
              v=premium._visual_variant(spec,0)
              variants.add(v)
              html=premium._render_visual('Sample',0,spec)
              assert f'visual-v{v}' in html
              assert 'visual-frame' in html and 'visual-bars' in html and 'visual-chip' in html
              samples.append(html)
          assert len(variants) >= 5, variants
          assert len(set(samples)) >= 5

          config={
              'name':'CI','organization':'CI','programme':'Test','goal':'A clear test goal.',
              'audience':'Test audience','tone':'clear','hero_title':'Test hero',
              'hero_subtitle':'Test sub','cta_text':'Contact','language':'en',
              'brand':{'primary_color':'#123456','secondary_color':'#d9ff65','background_color':'#f5f5f2','text_color':'#111111'}
          }
          page={'slug':'index','title':'Home','purpose':'Overview','sections':[]}
          spec={'site_name':'CI','design_system':{'motif':'tech_precision','composition':'rail'},'pages':[page,{'slug':'kontakt','title':'Kontakt','purpose':'Contact','sections':[]}]}
          rendered=premium._render_page(config,spec,page,0)
          assert 'visual-v' in rendered
          assert rendered.count('<section') >= 5
          print('Deterministic art-direction diversity checks passed')
          PY
      - name: Validate adaptive expert model routing
        run: |
          python - <<'PY'
          import os
          from api import model_router

          old_expert=os.environ.get('OLLAMA_EXPERT_MODELS')
          old_routing=os.environ.get('MODEL_ROUTING')
          os.environ['OLLAMA_EXPERT_MODELS']='kat-coder-test,qwen3.6-test'
          os.environ['MODEL_ROUTING']='adaptive'
          try:
              assert model_router._needs_expert(
                  'Repair this Python traceback in the repository and produce a patch.',
                  'You are a senior debugging engineer.',
                  num_predict=4000,
              )
              assert not model_router._needs_expert(
                  'Plan a polished five-page website from this customer brief.',
                  'You are a senior product designer and information architect.',
                  num_predict=2400,
              )
              expert=model_router._ollama_models(
                  'auto',
                  prompt='Fix this failing test and root cause in the codebase.',
                  system='You are a senior debugging engineer.',
                  num_predict=4000,
              )
              fast=model_router._ollama_models(
                  'auto',
                  prompt='Plan a website.',
                  system='You are a senior product designer.',
                  num_predict=2400,
              )
              assert expert[0]=='kat-coder-test', expert
              assert fast[0] == model_router._fast_models()[0], fast
          finally:
              if old_expert is None: os.environ.pop('OLLAMA_EXPERT_MODELS',None)
              else: os.environ['OLLAMA_EXPERT_MODELS']=old_expert
              if old_routing is None: os.environ.pop('MODEL_ROUTING',None)
              else: os.environ['MODEL_ROUTING']=old_routing
          print('Adaptive expert routing checks passed')
          PY
      - name: Validate final product lifecycle and delivery
        run: |
          python - <<'PY'
          import json, uuid
          from api import enhanced_runtime
          from api import production_queue
          from tools.production_load_test import expand, payload

          project_a='ci-'+uuid.uuid4().hex
          project_b='ci-'+uuid.uuid4().hex
          name={'name':'Same Customer Site'}
          repo_a=enhanced_runtime.repo_name_for(name, project_a)
          repo_b=enhanced_runtime.repo_name_for(name, project_b)
          assert repo_a != repo_b
          assert repo_a.startswith('generated-site-same-customer-site-')

          files={'index.html':'<!doctype html><html><body>ok</body></html>','assets/site.css':'body{}'}
          manifest=enhanced_runtime._delivery_manifest(
              files,
              project_id=project_a,
              config={'name':'Same Customer Site','organization':'CI'},
              visual_report={'score':94,'passed':True},
              originality={'score':.9},
          )
          assert manifest['project_id']==project_a
          assert manifest['file_count']==2
          assert all(len(item['sha256'])==64 for item in manifest['files'])

          qid='ci-cancel-'+uuid.uuid4().hex
          assert production_queue.enqueue_project(qid)
          assert production_queue.request_cancel(qid) == 'cancelled'
          assert production_queue.cancel_requested(qid) is True

          sample=payload(expand(1)[0])
          assert sample['benchmark_mode'] is True
          delivered=payload(expand(1)[0], benchmark_mode=False)
          assert delivered['benchmark_mode'] is False

          source=open('api/enhanced_runtime.py',encoding='utf-8').read()
          revisions=open('api/revisions.py',encoding='utf-8').read()
          assert 'github_replace_bundle(repo_name, files' in source
          assert 'github_replace_bundle(' in revisions
          print('Lifecycle, unique delivery, benchmark isolation and atomic publish checks passed')
          PY
      - name: Validate production security and preflight contract
        run: |
          python - <<'PY'
          from pathlib import Path
          from api import main as core
          from api import preflight

          assert core.APP_SECRET != 'dev-change-me'
          assert len(core.APP_SECRET) >= 40
          assert preflight.MIN_DISK_BLOCK_GB > 0
          assert preflight.MIN_DISK_WARN_GB > preflight.MIN_DISK_BLOCK_GB
          assert Path(core.DB_PATH).parent.exists()
          print('Persistent JWT secret and production preflight contract checks passed')
          PY
      - name: Validate production abuse guard
        run: |
          python - <<'PY'
          from api import billing_gate

          assert billing_gate.MAX_ACTIVE_PROJECTS_PER_USER >= 1
          assert billing_gate.MAX_UNPAID_PREVIEWS_24H >= 1
          assert billing_gate._quota_exempt('missing-user') is False
          print('Build abuse guard configuration checks passed')
          PY
      - name: Validate self-healing production worker pool
        run: |
          python - <<'PY'
          import asyncio
          from api import production_queue

          async def main():
              production_queue.ensure_schema()
              alive = production_queue.ensure_worker_pool()
              assert alive == production_queue.WORKER_COUNT, (alive, production_queue.WORKER_COUNT)
              snap = production_queue.queue_snapshot()
              assert snap['workers_alive'] == production_queue.WORKER_COUNT, snap
              assert snap['worker_pool_healthy'] is True, snap
              assert snap['workers_crashed'] == 0, snap

              for task in list(production_queue._worker_tasks):
                  task.cancel()
              if production_queue._worker_tasks:
                  await asyncio.gather(*production_queue._worker_tasks, return_exceptions=True)
              production_queue._worker_tasks.clear()

          asyncio.run(main())
          print('Self-healing worker pool checks passed')
          PY
      - name: Validate fast production profile V2
        run: |
          python - <<'PY'
          from api import visual_qa

          paths=['index.html','about.html','contact.html','services.html']
          assert [name for name,_ in visual_qa._viewports_for_path('index.html',paths)] == ['desktop','tablet','mobile']
          assert [name for name,_ in visual_qa._viewports_for_path('about.html',paths)] == ['desktop','tablet','mobile']
          assert [name for name,_ in visual_qa._viewports_for_path('contact.html',paths)] == ['desktop','mobile']
          assert [name for name,_ in visual_qa._viewports_for_path('services.html',paths)] == ['desktop','mobile']

          source=open('api/robust_generation.py',encoding='utf-8').read()
          critic=open('api/design_critic.py',encoding='utf-8').read()
          vision=open('api/vision_review.py',encoding='utf-8').read()
          start=open('start-product.ps1',encoding='utf-8').read()
          local=open('api/start-local.ps1',encoding='utf-8').read()

          assert 'tier: str = "fast"' in source
          assert 'attempts=1' in source
          assert 'CUSTOMER={json.dumps(compact_brief' in source
          assert 'tier="fast"' in critic
          assert 'body_chars < 120' in critic
          assert 'num_predict": 420' in vision
          assert 'deterministic_qa_requires_repair_first' in vision
          assert '$autoModelConcurrency = if ($systemRamGB -ge 24) { "2" } else { "1" }' in start
          assert '$autoModelConcurrency = if ($systemRamGB -ge 24) { "2" } else { "1" }' in local
          assert 'Dependencies: cached / unchanged' in local
          print('Fast production profile V2 checks passed')
          PY
      - name: Validate PowerShell startup syntax
        shell: pwsh
        run: |
          $files = @(
            "start-product.ps1",
            "api/start-local.ps1",
            "run-production-load-test.ps1",
            "install-expert-model.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error "$file line $($_.Extent.StartLineNumber): $($_.Message)"
              }
              exit 1
            }
          }
          Write-Host "PowerShell startup syntax checks passed"
      - name: Validate first-pass success optimizations
        run: |
          python - <<'PY'
          from api import autonomous_supervisor
          from api import enhanced_runtime
          from api import robust_generation

          cfg={'name':'Test','custom_requirements':'No phone supplied','pages':[{'title':'Home','slug':'index'}]}
          sections=[{'type':'content','heading':'Call us','body':'Reach us at +386 40 123 456 today.'}]
          clean=robust_generation._sanitize_planned_sections(sections,cfg)
          assert '+386' not in clean[0]['body']

          files={'index.html':'<html><body><p>Call +386 40 123 456</p></body></html>','assets/site.css':'body{}'}
          changed=enhanced_runtime._strip_unsupported_contact_facts(files,cfg)
          assert changed == 1
          assert '+386' not in files['index.html']

          css={'assets/site.css':'body{}'}
          assert enhanced_runtime._apply_deterministic_overflow_guard(css) is True
          assert 'pv-overflow-guard' in css['assets/site.css']
          assert enhanced_runtime._apply_deterministic_overflow_guard(css) is False

          decision=autonomous_supervisor.decide({
