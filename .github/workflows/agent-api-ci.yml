name: Agent API CI

on:
  push:
    branches: [main, feature/autonomous-website-agent-api, feature/product-console-v2]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r api/requirements.txt
      - name: Compile API runtime
        run: >-
          python -m py_compile
          api/main.py api/robust_generation.py api/premium_generation.py api/premium_quality.py
          api/billing.py api/billing_gate.py api/media.py api/media_render.py api/binary_publish.py
          api/pages_publish.py api/visual_qa.py api/vision_review.py api/enhanced_runtime.py
          api/learning_runtime.py api/revisions.py api/retry_routes.py api/dashboard.py
          api/preview.py api/notifications.py api/handoff_runtime.py
          api/model_router.py api/repo_map.py api/deep_static_qa.py api/design_critic.py
          api/source_editor.py api/site_import.py api/image_studio.py api/autonomous_supervisor.py api/capabilities.py
          api/server.py api/create_test_user.py
      - name: Import complete server
        env:
          APP_SECRET: ci-only-secret
          OLLAMA_MODEL: qwen2.5-coder:3b
          VISUAL_QA_MODEL: qwen2.5vl:3b
          VISUAL_QA_VISION: 'false'
        run: |
          python - <<'PY'
          import api.server
          routes = {route.path for route in api.server.app.routes}
          required = {
              '/health',
              '/auth/register',
              '/auth/login',
              '/projects',
              '/projects/{project_id}/images',
              '/projects/{project_id}/revise',
              '/projects/{project_id}/revisions',
              '/projects/{project_id}/source.zip',
              '/projects/{project_id}/visual-qa',
              '/projects/{project_id}/preview-session',
              '/projects/{project_id}/handoff',
              '/projects/{project_id}/handoff-email',
              '/projects/{project_id}/domain',
              '/dashboard/projects',
              '/billing/config',
              '/billing/checkout',
              '/agent/learning',
              '/agent/state',
              '/agent/models',
              '/agent/capabilities',
              '/agent/supervisor',
              '/agent/supervisor/run',
              '/projects/{project_id}/supervisor',
              '/imports/site',
              '/projects/{project_id}/editor/files',
              '/projects/{project_id}/editor/file',
              '/projects/{project_id}/editor/context',
              '/projects/{project_id}/versions',
              '/projects/{project_id}/rollback',
              '/projects/{project_id}/images/{image_id}/preview',
              '/projects/{project_id}/image-studio/history/{image_id}',
              '/projects/{project_id}/image-studio/edit',
              '/projects/{project_id}/image-studio/generate-background',
              '/projects/{project_id}/image-studio/restore/{snapshot_id}',
          }
          missing = required - routes
          assert not missing, f'Missing routes: {missing}'
          print(api.server.app.title)
          PY
      - name: Validate media placement rules
        run: |
          python - <<'PY'
          from api.media import _safe_placement, _clamp_percent
          assert _safe_placement('hero') == 'hero'
          assert _safe_placement('logo') == 'logo'
          assert _safe_placement('page:programme:content') == 'page:programme:content'
          assert _safe_placement('page:stories:gallery') == 'page:stories:gallery'
          assert _safe_placement('../unsafe') == 'auto'
          assert _clamp_percent(-4) == 0
          assert _clamp_percent(104) == 100
          PY
      - name: Validate ZIP import and repo map safety
        run: |
          python - <<'PY'
          from fastapi import HTTPException
          from PIL import Image
          from api.site_import import _normalise_member, _write_stage, _read_stage, _stage_text_files, _stage_dir, _bundle_sha256
          from api.binary_publish import _expected_bundle_manifest, _tree_matches_bundle
          from api.repo_map import build_repo_map
          from api.media import _focal_crop

          assert _normalise_member('site/assets/app.js') == 'site/assets/app.js'

          staging_id = 'ci-zip-stage'
          staged_files = {
              'index.html': b'<!doctype html><html><head><title>Stage</title></head><body><main>OK</main></body></html>',
              'assets/site.css': b'body{margin:0}',
          }
          _write_stage(staging_id, staged_files, {'repo_slug':'ci-repo','safe_name':'CI','config':{}})
          restored, manifest = _read_stage(staging_id)
          assert restored == staged_files
          assert manifest['repo_slug'] == 'ci-repo'
          staged_text, deliverable = _stage_text_files(restored)
          assert 'index.html' in staged_text and isinstance(deliverable['index.html'], str)
          assert _bundle_sha256(staged_files) == _bundle_sha256(dict(reversed(list(staged_files.items()))))

          exact_bundle = {
              'index.html': staged_files['index.html'].decode('utf-8'),
              'assets/site.css': staged_files['assets/site.css'].decode('utf-8'),
              'assets/photo.png': b'\\x89PNG\\r\\n\\x1a\\nCI',
          }
          manifest = _expected_bundle_manifest(exact_bundle)
          tree = [{'path': path, 'type': 'blob', 'sha': sha} for path, sha in manifest.items()]
          exact, expected, actual = _tree_matches_bundle(exact_bundle, tree)
          assert exact and expected == actual
          tree_with_stale = tree + [{'path':'README.md','type':'blob','sha':'deadbeef'}]
          exact, _, actual = _tree_matches_bundle(exact_bundle, tree_with_stale)
          assert not exact and 'README.md' in actual

          import shutil
          shutil.rmtree(_stage_dir(staging_id), ignore_errors=True)
          assert _normalise_member('node_modules/x.js') is None
          try:
              _normalise_member('../escape.html')
              raise AssertionError('Traversal path was accepted')
          except HTTPException:
              pass

          files = {
              'index.html': '<!doctype html><html><head><title>Demo</title></head><body><h1>Hello</h1><main id="main">X</main></body></html>',
              'assets/site.css': ':root{--primary:#123456}.hero{display:grid}@media(max-width:700px){.hero{display:block}}',
              'assets/site.js': 'function boot(){ return true; }',
          }
          repo_map = build_repo_map(files)
          assert 'index.html' in repo_map and 'Hello' in repo_map and 'boot' in repo_map

          image = Image.new('RGB', (1600, 1200), 'white')
          cropped = _focal_crop(image, 16/10, 75, 40)
          assert cropped.size == (1600, 1000)
          image.close()
          cropped.close()
          print('ZIP, repo map and focal crop smoke tests passed')
          PY
      - name: Validate release quality gate
        env:
          APP_SECRET: ci-only-secret
          VISUAL_QA_VISION: 'false'
        run: |
          python - <<'PY'
          from api.robust_generation import _repair_deterministic_bundle
          from api.enhanced_runtime import _quality_gate_passed

          files = {
              'index.html': '<!doctype html><html><body><main><a href="contact.html">Kontakt</a><button class="menu"><span></span><span></span></button></main></body></html>',
              'kontakt.html': '<!doctype html><html><body><main>Kontakt</main></body></html>',
          }
          repaired = _repair_deterministic_bundle(files)
          assert 'href="kontakt.html"' in repaired['index.html']
          assert 'aria-label="Open navigation menu"' in repaired['index.html']

          good_visual = {'available': True, 'passed': True, 'score': 80}
          assert _quality_gate_passed([], good_visual)
          assert not _quality_gate_passed([{'severity':'high'}], good_visual)
          assert not _quality_gate_passed([], {'available': True, 'passed': True, 'score': 79})
          assert not _quality_gate_passed([], {'available': False, 'passed': False, 'score': None})
          print('Release gate and deterministic repair tests passed')
          PY
      - name: Validate autonomous supervisor decisions
        run: |
          python - <<'PY'
          from api.autonomous_supervisor import decide

          runtime={'model_online': True, 'disk_free_gb': 20}
          base={
              'status':'queued','status_age_seconds':120,'recovery_count':0,
              'seconds_since_recovery':None,'issues':{'severe':0,'codes':[],'messages':[]},
              'repository_ready':False,'public_live':False,'payment_blocked':False,
              'publish_action_required':None,'failure_stage':None,
          }
          d=decide(dict(base), runtime)
          assert d.choice=='retry_build' and d.autonomous

          payment=dict(base,status='ready_for_payment',status_age_seconds=999)
          d=decide(payment,runtime)
          assert d.choice=='hold_payment' and not d.autonomous

          stuck=dict(base,status='building',status_age_seconds=2000)
          d=decide(stuck,runtime)
          assert d.choice=='retry_build' and d.reason_code=='stale_build_recovery'

          publish=dict(base,status='publishing',status_age_seconds=2000,repository_ready=True)
          d=decide(publish,runtime)
          assert d.choice=='retry_publish'

          circuit=dict(base,status='failed',status_age_seconds=2000,recovery_count=3)
          d=decide(circuit,runtime)
          assert d.choice=='human_review' and not d.autonomous

          offline=dict(base,status='failed',status_age_seconds=2000)
          d=decide(offline,{'model_online':False,'disk_free_gb':20})
          assert d.choice=='wait' and d.reason_code=='model_backend_offline'

          imported=dict(base,status='repository_ready',status_age_seconds=120,imported_site=True)
          d=decide(imported,runtime)
          assert d.choice=='wait' and d.reason_code=='zip_import_owned_by_import_worker'

          imported_failed=dict(base,status='failed',status_age_seconds=2000,imported_site=True)
          d=decide(imported_failed,runtime)
          assert d.choice=='human_review' and d.reason_code=='zip_import_failed'

          print('Autonomous supervisor typed-decision tests passed')
          PY
      - name: Validate Image Studio core
        run: |
          python - <<'PY'
          from PIL import Image
          from api.image_studio import _pct_crop, _procedural_background, _compose

          img = Image.new('RGBA', (1000, 800), (255, 255, 255, 255))
          cropped = _pct_crop(img, 10, 10, 50, 50)
          assert cropped.size == (500, 400)
          bg = _procedural_background('green editorial hero', 512, 512, ('#123f35','#d9ff65','#f5f7f6'))
          assert bg.size == (512, 512)
          subject = Image.new('RGBA', (512,512), (0,0,0,0))
          subject.paste((255,0,0,255), (150,100,350,450))
          composed = _compose(subject, mode='color', color='#ffffff', background=None, shadow=True)
          assert composed.size == subject.size
          img.close(); cropped.close(); bg.close(); subject.close(); composed.close()
          print('Image Studio smoke tests passed')
          PY
      - name: Check browser JavaScript syntax
        run: |
          node --check dist/assets/builder.js
          node --check dist/assets/revision-ui.js
          node --check dist/assets/landing-start.js
          node --check dist/assets/workspace-upgrades.js
          node --check dist/assets/media-fix.js
          node --check dist/assets/preview-email-ui.js
          node --check dist/assets/dashboard.js
          node --check dist/assets/dashboard-upgrades.js
          node --check dist/assets/runtime-config.js
          node --check dist/assets/readiness-v3.js
          node --check dist/assets/import-v1.js
          node --check dist/assets/editor-v1.js
          node --check dist/assets/agent-console-v1.js
          node --check dist/assets/image-studio-v1.js
          node --check dist/assets/i18n-v1.js
      - name: Check SL EN translator
        run: |
          for file in dist/index.html dist/builder.html dist/dashboard.html dist/editor.html dist/image-studio.html; do
            grep -q 'assets/i18n-v1.js?v=20260926-3' "$file"
            grep -q 'id="pvLanguageSwitch"' "$file"
            grep -q 'data-lang="sl"' "$file"
            grep -q 'data-lang="en"' "$file"
          done
          grep -q "pv_language" dist/assets/i18n-v1.js
          grep -q "observerApplying" dist/assets/i18n-v1.js
          grep -q "if(node.nodeValue!==next)node.nodeValue=next" dist/assets/i18n-v1.js
          grep -q "data-lang='sl'\|data-lang=\"sl\"" dist/assets/i18n-v1.js
          grep -q "data-lang='en'\|data-lang=\"en\"" dist/assets/i18n-v1.js
          grep -q "Date.now()" dist/runtime.html
          ! grep -q "v=20260909-6" dist/runtime.html
          ! grep -q "v=20260909-6" start-product.ps1
          echo "Translator, static SL EN switches and cache-busting checks passed"
      - name: Check ZIP import UI contract
        run: |
          grep -q 'import-v1.js?v=20260926-2' dist/builder.html
          grep -q 'workspace-v2.css?v=20260926-2' dist/builder.html
          grep -q 'waitForImport' dist/assets/import-v1.js
          grep -q 'Gateway je vrnil HTML namesto API odgovora' dist/assets/import-v1.js
          grep -q 'main.insertBefore(box,card)' dist/assets/import-v1.js
      - name: Check public Media Studio contract
        run: |
          grep -q 'id="mediaStudioCard"' dist/builder.html
          grep -q 'id="projectImages"' dist/builder.html
          grep -q 'Fotografije in logotip' dist/builder.html
          grep -q 'Drag & drop' dist/builder.html
          grep -q 'assets/media-fix.js' dist/builder.html
          grep -q 'assets/workspace-upgrades.js' dist/builder.html
          grep -q 'assets/import-v1.js' dist/builder.html
          grep -q 'id="codeEditor"' dist/editor.html
          grep -q 'dist/builder.html' .github/workflows/pages.yml
      - name: Check product files
        run: |
          test -f dist/index.html
          test -f dist/builder.html
          test -f dist/dashboard.html
          test -f dist/editor.html
          test -f dist/image-studio.html
          test -f dist/assets/image-studio-v1.css
          test -f dist/assets/image-studio-v1.js
          test -f dist/assets/i18n-v1.js
          test -f dist/assets/editor-v1.css
          test -f dist/assets/editor-v1.js
          test -f dist/assets/import-v1.js
          test -f dist/builder/index.html
          test -f dist/404.html
          test -f dist/assets/builder.js
          test -f dist/assets/revision-ui.js
          test -f dist/assets/landing-start.js
          test -f dist/assets/workspace-upgrades.js
          test -f dist/assets/media-fix.js
          test -f dist/assets/preview-email-ui.js
          test -f dist/assets/dashboard.js
          test -f dist/assets/dashboard-upgrades.js
          test -f api/visual_qa.py
          test -f api/vision_review.py
          test -f api/dashboard.py
          test -f api/preview.py
          test -f api/notifications.py
          test -f api/handoff_runtime.py
          test -f api/learning_runtime.py
          test -f api/model_router.py
          test -f api/repo_map.py
          test -f api/deep_static_qa.py
          test -f api/design_critic.py
          test -f api/source_editor.py
          test -f api/site_import.py
          test -f api/image_studio.py
          test -f api/autonomous_supervisor.py
          test -f api/capabilities.py
          test -f api/create_test_user.py
          test -f configure-email.ps1
          test -f start-product.ps1
          test -f start-stable-local.ps1
