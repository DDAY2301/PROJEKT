name: Agent API CI

on:
  push:
    branches: [main, feature/autonomous-website-agent-api, feature/product-console-v2]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r api/requirements.txt
      - name: Compile API runtime
        run: python -m py_compile api/main.py api/enhanced_runtime.py api/server.py
      - name: Import complete server
        env:
          APP_SECRET: ci-only-secret
          OLLAMA_MODEL: qwen2.5-coder:3b
        run: python -c "import api.server; print(api.server.app.title)"
      - name: Check product files
        run: |
          test -f dist/index.html
          test -f dist/builder/index.html
          test -f dist/assets/builder.js
          test -f start-product.ps1
