name: Objavi spletno stran

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Prepare canonical public studio
        shell: bash
        run: |
          set -euo pipefail
          ASSET_V="${GITHUB_SHA::12}"
          STUDIO="studio-v3.html"

          # Publish the actual current builder under a brand-new canonical file name.
          # This path has never been used by the old UI, so stale browser/CDN copies
          # of builder.html cannot affect it.
          cp dist/builder.html "dist/${STUDIO}"

          # Bust all builder CSS/JS assets with this exact release SHA.
          sed -i -E "s#v=20260914-[0-9]+#v=${ASSET_V}#g" "dist/${STUDIO}"

          # Point every public entry point at the canonical studio file.
          sed -i "s#builder\.html#${STUDIO}#g" dist/index.html
          sed -i "s#new URL('builder/', location.href)#new URL('${STUDIO}', location.href)#" dist/assets/landing-start.js
          sed -i "s#builder\.html#${STUDIO}#g" dist/dashboard.html

          # Old bookmarks remain valid but immediately converge on studio-v3.
          cat > dist/builder.html <<EOF
          <!doctype html>
          <html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Project Visibility</title></head>
          <body><script>location.replace('./${STUDIO}'+location.search+location.hash)</script><p>Odpiram Project Visibility studio …</p></body></html>
          EOF

          cat > dist/builder/index.html <<EOF
          <!doctype html>
          <html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Project Visibility</title></head>
          <body><script>location.replace('../${STUDIO}'+location.search+location.hash)</script><p>Odpiram Project Visibility studio …</p></body></html>
          EOF

          printf '%s\n' "${STUDIO}" > dist/current-workspace.txt
          printf '%s\n' "${GITHUB_SHA}" > dist/release.txt

          # Hard fail the deployment if Media Studio is missing from the published HTML.
          grep -q 'id="mediaStudioCard"' "dist/${STUDIO}"
          grep -q 'id="projectImages"' "dist/${STUDIO}"
          grep -q 'Fotografije in logotip' "dist/${STUDIO}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Objavi
        id: deployment
        uses: actions/deploy-pages@v4
