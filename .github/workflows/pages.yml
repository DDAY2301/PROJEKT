name: Objavi spletno stran

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare immutable public workspace
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ID="${GITHUB_SHA::12}"
          WORKSPACE="workspace-${BUILD_ID}.html"

          # Keep an immutable copy of the newest builder so GitHub Pages/browser
          # caches can never serve an older workspace after a deployment.
          cp dist/builder.html "dist/${WORKSPACE}"

          # Landing page buttons point directly at the immutable workspace.
          sed -i "s#builder\.html#${WORKSPACE}#g" dist/index.html
          sed -i "s#new URL('builder/', location.href)#new URL('${WORKSPACE}', location.href)#" dist/assets/landing-start.js

          # /builder/ remains a stable convenience URL, but redirects to the
          # immutable workspace generated by this exact deployment.
          cat > dist/builder/index.html <<EOF
          <!doctype html>
          <html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Project Visibility</title></head>
          <body><script>location.replace('../${WORKSPACE}'+location.search+location.hash)</script><p>Odpiram najnovejši workspace …</p></body></html>
          EOF

          # The legacy builder.html also redirects forward. Existing bookmarks
          # therefore converge on the same deployed workspace once refreshed.
          cat > dist/builder.html <<EOF
          <!doctype html>
          <html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Project Visibility</title></head>
          <body><script>location.replace('./${WORKSPACE}'+location.search+location.hash)</script><p>Odpiram najnovejši workspace …</p></body></html>
          EOF

          printf '%s\n' "${WORKSPACE}" > dist/current-workspace.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Objavi
        id: deployment
        uses: actions/deploy-pages@v4
