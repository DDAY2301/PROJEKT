name: Objavi spletno stran

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Validate public builder
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/builder.html
          test -f dist/dashboard.html
          test -f dist/assets/builder.js
          test -f dist/assets/media-fix.js
          grep -q 'id="mediaStudioCard"' dist/builder.html
          grep -q 'id="projectImages"' dist/builder.html
          grep -q 'Fotografije in logotip' dist/builder.html
          grep -q 'Drag & drop' dist/builder.html
          grep -q 'assets/media-fix.js' dist/builder.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Objavi
        id: deployment
        uses: actions/deploy-pages@v4
